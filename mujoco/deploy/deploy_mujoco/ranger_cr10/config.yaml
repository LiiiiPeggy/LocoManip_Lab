# RangerBox-CR10, stage 4.6: the 8-D teleoperation policy in MuJoCo.
#
# Every number here either mirrors the Isaac Lab task or is a deployment-only choice; the
# comment says which. Changing an interface number (scales, decimation, default pose) would
# make the policy see something it was not trained on, so those are not tuning knobs.

# stage 4.9: the collision-aware policy. Chosen over 5500/5999 on the 4.8 box (50 mm / 5 deg
# coverage 73.3% against 66.7% and 63.3%) while matching them on collisions -- measured in
# MuJoCo, zero contact with the lidar, the chassis camera or the chassis in every low-target
# scenario, against 51-93% for the 4.8 policy on the same model.
# Previous deployments, kept for comparison:
#   2026-11-02_00-30-47_stage48a_ppo/model_5999.pt   (4.8, no safety term)
#   2026-10-31_23-09-08_stage47c_ppo/model_2999.pt   (4.7)
policy_path: "{CURRENT_ROOT_DIR}/logs/rsl_rl/ranger_cr10_teleop/2026-11-02_19-28-51_stage49a_ppo/model_5000.pt"
scene_path: "{CURRENT_ROOT_DIR}/mujoco/robots/ranger_cr10/scene.xml"

# Isaac: sim.dt = 0.005, decimation = 20 -> the policy runs at 10 Hz.
simulation_dt: 0.005
control_decimation: 20

# 4.5k zero-velocity filter (scripts/ranger_cr10/base_command_filter.py). Stage 4.5k's
# measured drift is 1.4-2.5 mm per 30 s unfiltered and 0.4-0.9 mm with the lock.
filter:
  enabled: true
  vx_deadband: 0.02     # m/s
  wz_deadband: 0.02     # rad/s
  lock_output: true     # zero the actor's own chassis output where the command is zero
  hysteresis: 0.0

# Keyboard rates: the same defaults as the verified Isaac Lab controller.
keyboard:
  vx_max: 0.5
  wz_max: 0.5
  vel_rate: 0.5
  vel_return_rate: 1.0
  # Which measured workspace the clamps come from, from scripts/ranger_cr10/workspace_limits.py:
  #   4.7          the box the 4.7 policy was verified to hold
  #   4.8          the box the 4.8 policy was verified to hold
  #   4.8_explore  the unverified candidate box; the status line marks the 探索区
  #   4.9          re-measured with the collision model complete: Z- stops at -0.05
  #   4.10         forward-pointing default, Z floor from the measured (x, y) table (default)
  profile: "4.10"

viewer: true
status_fps: 5.0
